[package]
name = "oxk-zed"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "ArkTS language support for Zed"

[lib]
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7.0"
arkts-sdk = { path = "crates/arkts-sdk" }

[dev-dependencies]
wasmparser = "0.227.1"

[workspace]
members = [".", "crates/arkts-sdk", "crates/arkts-services", "crates/arkts-lsp"]
default-members = ["."]
resolver = "2"

[workspace.dependencies]
serde_json = "1"
json5 = "1"
oxc_allocator = { git = "https://github.com/ohos-rs/oxc", branch = "ohos" }
oxc_ast = { git = "https://github.com/ohos-rs/oxc", branch = "ohos" }
oxc_ast_visit = { git = "https://github.com/ohos-rs/oxc", branch = "ohos" }
oxc_parser = { git = "https://github.com/ohos-rs/oxc", branch = "ohos" }
oxc_span = { git = "https://github.com/ohos-rs/oxc", branch = "ohos" }
tsrs_core = { git = "https://github.com/ohos-rs/tsrs", branch = "ohos" }
tsrs_lsp = { git = "https://github.com/ohos-rs/tsrs", branch = "ohos" }
tsrs_ls = { git = "https://github.com/ohos-rs/tsrs", branch = "ohos" }
tsrs_lsproto = { git = "https://github.com/ohos-rs/tsrs", branch = "ohos" }
tsrs_project = { git = "https://github.com/ohos-rs/tsrs", branch = "ohos" }
tsrs_vfs = { git = "https://github.com/ohos-rs/tsrs", branch = "ohos" }

[profile.release]
lto = "thin"
codegen-units = 1
